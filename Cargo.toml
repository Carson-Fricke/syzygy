[workspace]
members = ["runtime", "contracts", "graph", "projection", "inbox", "execution", "subagents", "sessions", "tools", "storage"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Optimize content hashing and chunk encoding while retaining debug assertions.
[profile.dev.package.base64]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.tiktoken-rs]
opt-level = 2
